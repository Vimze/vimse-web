<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Vimse — Organize your everyday life</title>
  <link rel="stylesheet" href="styles.css">
  <style>
    /* ─── Hero ─── */
    .hero {
      min-height: 100vh; background: var(--hero); position: relative; overflow: hidden;
      display: flex; align-items: center; padding: 120px 0 80px;
    }
    .hero::before {
      content: ''; position: absolute; inset: 0;
      background: radial-gradient(ellipse 80% 60% at 30% 50%, rgba(0,122,110,0.08) 0%, transparent 70%),
                  radial-gradient(ellipse 50% 50% at 80% 30%, rgba(61,148,137,0.05) 0%, transparent 60%);
    }
    .hero-inner {
      max-width: 1200px; margin: 0 auto; padding: 0 24px; position: relative; z-index: 1;
      display: grid; grid-template-columns: 1fr; gap: 48px; align-items: center;
    }
    @media (min-width: 768px) {
      .hero-inner { padding: 0 48px; grid-template-columns: 1fr auto; gap: 64px; }
    }
    .hero-text { max-width: 520px; }
    .hero-badge {
      display: inline-flex; align-items: center; gap: 8px;
      background: rgba(255,255,255,0.06); border: 1px solid rgba(255,255,255,0.08);
      border-radius: 100px; padding: 6px 16px 6px 8px; margin-bottom: 28px;
      font-size: 13px; color: var(--p300); font-weight: 500;
    }
    .hero-badge-dot {
      width: 8px; height: 8px; border-radius: 4px; background: var(--p400);
      animation: pulse 2s infinite;
    }
    @keyframes pulse {
      0%, 100% { opacity: 1; } 50% { opacity: 0.4; }
    }
    .hero h1 {
      font-family: var(--serif); font-size: 56px; font-weight: 700;
      color: #fff; line-height: 1.08; letter-spacing: -1px; margin-bottom: 20px;
    }
    @media (max-width: 767px) { .hero h1 { font-size: 38px; } }
    .hero h1 em { font-style: italic; color: var(--p300); }
    .hero-sub {
      font-size: 18px; line-height: 1.65; color: rgba(255,255,255,0.5); margin-bottom: 36px;
      max-width: 440px;
    }
    .hero-phones {
      display: flex; gap: 20px; align-items: flex-start; position: relative;
    }
    .hero-phones .phone-frame:nth-child(2) {
      margin-top: 60px;
    }
    @media (max-width: 767px) {
      .hero-phones { justify-content: center; }
      .hero-phones .phone-frame { width: 200px; height: 410px; border-radius: 32px; padding: 8px; }
      .hero-phones .phone-frame .phone-notch { width: 90px; height: 22px; }
      .hero-phones .phone-frame .phone-frame-inner { border-radius: 26px; }
      .hero-phones .phone-frame:nth-child(2) { display: none; }
    }
    /* Floating glow behind phones */
    .hero-glow {
      position: absolute; width: 400px; height: 400px; border-radius: 50%;
      background: var(--p500); opacity: 0.08; filter: blur(80px);
      top: 50%; left: 50%; transform: translate(-50%, -50%);
      pointer-events: none;
    }

    /* ─── Values grid ─── */
    .values-grid {
      display: grid; grid-template-columns: 1fr; gap: 20px;
    }
    @media (min-width: 640px) { .values-grid { grid-template-columns: 1fr 1fr; } }
    @media (min-width: 1024px) { .values-grid { grid-template-columns: repeat(4, 1fr); } }

    /* ─── Feature showcase ─── */
    .feature-visual {
      display: flex; justify-content: center; align-items: center;
      position: relative;
    }
    .feature-visual-bg {
      position: absolute; width: 320px; height: 320px; border-radius: 50%;
      background: var(--p100); opacity: 0.5; filter: blur(40px);
      pointer-events: none;
    }
    .section-dark .feature-visual-bg {
      background: var(--p500); opacity: 0.06;
    }

    /* ─── Floating cards decoration ─── */
    .floating-card {
      position: absolute; background: #fff; border-radius: 16px;
      padding: 14px 18px; box-shadow: 0 8px 32px rgba(0,0,0,0.12);
      font-size: 13px; font-weight: 600; color: var(--g800);
      display: flex; align-items: center; gap: 10px;
      animation: float 6s ease-in-out infinite;
      z-index: 3;
    }
    @keyframes float {
      0%, 100% { transform: translateY(0); }
      50% { transform: translateY(-8px); }
    }
    .floating-card-icon {
      width: 32px; height: 32px; border-radius: 10px;
      display: flex; align-items: center; justify-content: center;
    }

    /* ─── Subtle texture for surface sections ─── */
    .texture-grid {
      background-image:
        linear-gradient(rgba(0,0,0,0.015) 1px, transparent 1px),
        linear-gradient(90deg, rgba(0,0,0,0.015) 1px, transparent 1px);
      background-size: 48px 48px;
    }
  </style>
</head>
<body>

<div id="root"></div>

<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<script type="text/babel" src="components.jsx"></script>
<script type="text/babel" src="tweaks-panel.jsx"></script>
<script type="text/babel">

const TWEAK_DEFAULTS = /*EDITMODE-BEGIN*/{
  "heroStyle": "gradient",
  "showFloatingCards": true,
  "accentSectionDark": true
}/*EDITMODE-END*/;

function LandingPage() {
  useReveal();
  const [tweaks, setTweak] = useTweaks(TWEAK_DEFAULTS);

  return (
    <>
      <SiteNav dark={true} current="home" />

      {/* ═══ HERO ═══ */}
      <section className="hero">
        <div className="hero-inner">
          <div className="hero-text">
            <div className="hero-badge">
              <div className="hero-badge-dot"></div>
              Now available on iOS &amp; Android
            </div>
            <h1>Organize your <em>everyday</em> life</h1>
            <p className="hero-sub">
              Recipes, shopping lists, and everything in between — in one fast, offline-first app that respects your time.
            </p>
            <StoreBadges size={52} />
          </div>
          <div className="hero-phones">
            <div className="hero-glow"></div>
            <PhoneMockup>
              <MiniHomeScreen />
            </PhoneMockup>
            <PhoneMockup>
              <MiniRecipeScreen />
            </PhoneMockup>
            {tweaks.showFloatingCards && <>
              <div className="floating-card" style={{ top: 80, right: -30, animationDelay: '0s' }}>
                <div className="floating-card-icon" style={{ background: P[50] }}>
                  <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke={P[500]} strokeWidth="2"><polyline points="20,6 9,17 4,12"/></svg>
                </div>
                <span>Melk ✓</span>
              </div>
              <div className="floating-card" style={{ bottom: 100, left: -20, animationDelay: '2s' }}>
                <div className="floating-card-icon" style={{ background: '#FEF3C7' }}>
                  <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#D97706" strokeWidth="2"><path d="M6 13.87A4 4 0 013.5 6a4.02 4.02 0 011.25-2.91A4 4 0 0112 2a4 4 0 017.25 1.09A4 4 0 0120.5 6a4 4 0 01-2.5 7.87V21H6v-7.13z"/><line x1="6" y1="17" x2="18" y2="17"/></svg>
                </div>
                <span>4 porsjoner</span>
              </div>
            </>}
          </div>
        </div>
      </section>

      {/* ═══ VALUE PROPS ═══ */}
      <section className="section section-surface texture-grid">
        <div className="container">
          <div style={{ textAlign: 'center', marginBottom: 56 }} className="reveal">
            <p className="section-label">Why Vimse?</p>
            <h2 className="section-title" style={{ maxWidth: 500, margin: '0 auto' }}>Everything you need,<br/>nothing you don't</h2>
          </div>
          <div className="values-grid">
            {[
              { icon: <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke={P[500]} strokeWidth="2" strokeLinecap="round"><path d="M2 20h20M5 20V9l7-6 7 6v11"/><path d="M9 20v-5a3 3 0 016 0v5"/></svg>,
                title: 'Offline-first', desc: 'Works without internet. Syncs seamlessly when you reconnect.' },
              { icon: <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke={P[500]} strokeWidth="2" strokeLinecap="round"><circle cx="9" cy="21" r="1"/><circle cx="20" cy="21" r="1"/><path d="M1 1h4l2.68 13.39a2 2 0 002 1.61h9.72a2 2 0 002-1.61L23 6H6"/></svg>,
                title: 'Recipes + shopping', desc: 'Add recipe ingredients directly to any shopping list with one tap.' },
              { icon: <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke={P[500]} strokeWidth="2" strokeLinecap="round"><rect x="5" y="2" width="14" height="20" rx="3"/><line x1="12" y1="18" x2="12" y2="18.01"/></svg>,
                title: 'Cross-platform', desc: 'iOS, Android, and web — your data follows you everywhere.' },
              { icon: <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke={P[500]} strokeWidth="2" strokeLinecap="round"><path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/></svg>,
                title: 'Private & focused', desc: 'No ads, no tracking, no bloat. Your data stays on your device.' },
            ].map((v, i) => (
              <div key={i} className={`value-card reveal reveal-delay-${i}`}>
                <div className="value-icon">{v.icon}</div>
                <h3>{v.title}</h3>
                <p>{v.desc}</p>
              </div>
            ))}
          </div>
        </div>
      </section>

      {/* ═══ FEATURE 1 — Recipes ═══ */}
      <section className="section">
        <div className="container">
          <div className="feature-grid">
            <div className="feature-text reveal">
              <p className="section-label">Recipes</p>
              <h2 className="section-title">Your recipes,<br/>always with you</h2>
              <p className="section-subtitle" style={{ marginBottom: 28 }}>
                Create and manage recipes with ingredients, steps, and photos. Adjust servings and quantities recalculate automatically.
              </p>
              <div style={{ display: 'flex', flexDirection: 'column', gap: 14 }}>
                {['Ingredients auto-adjust when you change servings', 'Step-by-step instructions you can follow while cooking', 'Add all ingredients to a shopping list in one tap'].map((t, i) => (
                  <div key={i} style={{ display: 'flex', alignItems: 'flex-start', gap: 12 }}>
                    <div style={{ width: 24, height: 24, borderRadius: 8, background: P[50], display: 'flex', alignItems: 'center', justifyContent: 'center', flexShrink: 0, marginTop: 1 }}>
                      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke={P[500]} strokeWidth="2.5" strokeLinecap="round"><polyline points="20,6 9,17 4,12"/></svg>
                    </div>
                    <span style={{ fontSize: 15, color: G[600], lineHeight: 1.5 }}>{t}</span>
                  </div>
                ))}
              </div>
            </div>
            <div className="feature-visual reveal reveal-delay-1">
              <div className="feature-visual-bg"></div>
              <PhoneMockup style={{ position: 'relative', zIndex: 2 }}>
                <MiniRecipeScreen />
              </PhoneMockup>
            </div>
          </div>
        </div>
      </section>

      {/* ═══ FEATURE 2 — Shopping (dark) ═══ */}
      <section className={`section ${tweaks.accentSectionDark ? 'section-dark' : 'section-surface'}`} style={{ position: 'relative', overflow: 'hidden' }}>
        {tweaks.accentSectionDark && <>
          <div style={{ position: 'absolute', top: -100, right: '10%', width: 350, height: 350, borderRadius: '50%', background: P[500], opacity: 0.04, filter: 'blur(60px)' }}/>
          <div style={{ position: 'absolute', bottom: -80, left: '5%', width: 250, height: 250, borderRadius: '50%', background: P[400], opacity: 0.05, filter: 'blur(50px)' }}/>
        </>}
        <div className="container" style={{ position: 'relative' }}>
          <div className="feature-grid reverse">
            <div className="feature-text reveal">
              <p className="section-label">Shopping lists</p>
              <h2 className="section-title">Shop smarter,<br/>not harder</h2>
              <p className="section-subtitle" style={{ marginBottom: 28 }}>
                Track what you need, check items off as you go, and never forget an ingredient again. Reorder, archive, and share lists effortlessly.
              </p>
              <div style={{ display: 'flex', gap: 12, flexWrap: 'wrap' }}>
                {['Check off items', 'Drag to reorder', 'Archive old lists', 'Add from recipes'].map((t, i) => (
                  <span key={i} style={{ fontSize: 13, fontWeight: 600, color: tweaks.accentSectionDark ? P[300] : P[600], background: tweaks.accentSectionDark ? 'rgba(255,255,255,0.06)' : P[50], padding: '8px 16px', borderRadius: 12 }}>{t}</span>
                ))}
              </div>
            </div>
            <div className="feature-visual reveal reveal-delay-1">
              <div className="feature-visual-bg"></div>
              <PhoneMockup style={{ position: 'relative', zIndex: 2 }}>
                <MiniShoppingScreen />
              </PhoneMockup>
            </div>
          </div>
        </div>
      </section>

      {/* ═══ FEATURE 3 — Offline ═══ */}
      <section className="section" style={{ position: 'relative', overflow: 'hidden' }}>
        <div className="container" style={{ position: 'relative' }}>
          <div style={{ textAlign: 'center', maxWidth: 640, margin: '0 auto' }} className="reveal">
            <p className="section-label">Offline-first</p>
            <h2 className="section-title">Works everywhere.<br/>Even without Wi-Fi.</h2>
            <p className="section-subtitle" style={{ margin: '0 auto 48px' }}>
              Vimse stores everything locally on your device. Use it on a plane, in a basement grocery store, or deep in the countryside. When you reconnect, everything syncs automatically.
            </p>
            <div style={{ display: 'flex', justifyContent: 'center', gap: 32, flexWrap: 'wrap' }}>
              {[
                { num: '100%', label: 'Offline capable' },
                { num: '< 1s', label: 'App load time' },
                { num: '0', label: 'Ads or trackers' },
              ].map((s, i) => (
                <div key={i} style={{ textAlign: 'center' }}>
                  <div style={{ fontFamily: 'var(--serif)', fontSize: 44, fontWeight: 700, color: P[500], lineHeight: 1 }}>{s.num}</div>
                  <div style={{ fontSize: 14, color: G[500], marginTop: 6 }}>{s.label}</div>
                </div>
              ))}
            </div>
          </div>
        </div>
      </section>

      {/* ═══ FINAL CTA ═══ */}
      <DownloadCTA dark={true} />

      <SiteFooter />

      <TweaksPanel>
        <TweakToggle label="Floating cards on hero" value={tweaks.showFloatingCards} onChange={v => setTweak('showFloatingCards', v)} />
        <TweakToggle label="Dark accent section" value={tweaks.accentSectionDark} onChange={v => setTweak('accentSectionDark', v)} />
      </TweaksPanel>
    </>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<LandingPage />);
</script>
</body>
</html>
